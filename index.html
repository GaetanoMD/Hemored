<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bancos de Sangre — Perú</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a1520;color:#d0dce8;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
#hdr{background:linear-gradient(135deg,#0f1e2e,#0a1520);padding:8px 14px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #c8102e;flex-shrink:0}
.logo{font-size:12px;font-weight:800;color:#c8102e;letter-spacing:1px}
#hdr h1{font-size:12px;font-weight:600;color:#fff;flex:1}
#stats{display:flex;gap:12px}
.si{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap}
.sd{width:9px;height:9px;border-radius:50%}
.sq{width:9px;height:9px;border-radius:2px}
.sc{font-weight:700;font-size:13px}

/* CONTROLS */
#ctrl{background:#0f1e2e;padding:6px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #1a2e42;flex-shrink:0}
.cl{font-size:11px;color:#7a9ab5;font-weight:600;white-space:nowrap}
select{background:#0a1520;color:#d0dce8;border:1px solid #1e3a52;border-radius:4px;padding:3px 7px;font-size:11px;cursor:pointer}
select:focus{outline:none;border-color:#c8102e}
.tbtn{padding:2px 9px;border-radius:10px;border:2px solid transparent;font-size:10px;font-weight:700;cursor:pointer;transition:all .2s}
.tbtn.on{color:#fff}
.tbtn.off{opacity:.35;background:transparent!important;color:#666}
.t1a{background:#27ae60;border-color:#27ae60}
.t1b{background:#2980b9;border-color:#2980b9}
.t1c{background:#e67e22;border-color:#e67e22}
.t2{background:#c8102e;border-color:#c8102e}
.hint{font-size:10px;color:#7a9ab5;background:#0a1520;border:1px dashed #1e3a52;border-radius:4px;padding:2px 8px;margin-left:auto}
.hint b{color:#f1c40f}

/* LAYOUT */
#main{display:flex;flex:1;overflow:hidden}
#map{flex:1;position:relative}

/* NETWORK BANNER */
#nbanner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(200,16,46,.92);color:#fff;padding:5px 16px;border-radius:16px;font-size:11px;font-weight:700;z-index:1000;display:none;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.5);white-space:nowrap}
#nbanner:hover{background:rgba(160,13,37,.97)}

/* SIDEBAR */
#sb{width:255px;background:#0f1e2e;border-left:1px solid #1a2e42;display:flex;flex-direction:column;overflow:hidden}
#sbt{padding:8px 12px;font-size:10px;font-weight:700;color:#7a9ab5;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1a2e42}
#sbl{flex:1;overflow-y:auto;padding:4px}
#sbl::-webkit-scrollbar{width:3px}
#sbl::-webkit-scrollbar-thumb{background:#1e3a52;border-radius:2px}
.sc2{padding:6px 8px;margin-bottom:3px;border-radius:4px;background:#0a1520;border-left:3px solid #ccc;cursor:pointer;transition:background .15s}
.sc2:hover{background:#162840}
.sc2-t{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.sc2-n{font-size:10px;color:#d0dce8;font-weight:600;line-height:1.3}
.sc2-s{font-size:9px;color:#7a9ab5;margin-top:1px}
#sbc{padding:7px 12px;border-top:1px solid #1a2e42;font-size:10px;color:#7a9ab5}
#sbc b{color:#fff}

/* ===================== POPUP ===================== */
.pw{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;width:340px;max-width:340px}

/* Header strip */
.ph{padding:10px 12px 8px;border-radius:6px 6px 0 0;margin:-1px -1px 0}
.ph-badges{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px;border:1px solid transparent}
.badge-tipo{color:#fff}
.badge-sub{background:#1e3a52;color:#8ab0cc;border-color:#2a4a62}
.badge-data{background:#1a3020;color:#4caf50;border-color:#2a5030}
.badge-nodata{background:#2a1a1a;color:#e57373;border-color:#5a2a2a}
.ph-name{font-size:13px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:4px}
.ph-meta{font-size:10px;color:#8ab0cc;line-height:1.6}
.ph-meta b{color:#a0c4dd}

/* KPI row */
.kpi-row{display:flex;gap:6px;padding:8px 10px;background:#0a1824;border-top:1px solid #1a2e42;flex-wrap:wrap}
.kpi{flex:1;min-width:80px;background:#0f1e2e;border-radius:5px;padding:5px 7px;border-top:2px solid #ccc;text-align:center}
.kpi-v{font-size:14px;font-weight:700;color:#fff;line-height:1.2}
.kpi-l{font-size:9px;color:#7a9ab5;margin-top:1px;line-height:1.2}
.kpi-u{font-size:9px;color:#7a9ab5}

/* Semaphore */
.sem-green{color:#4caf50!important}
.sem-yellow{color:#ffc107!important}
.sem-red{color:#f44336!important}
.sem-gray{color:#78909c!important}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid #1a2e42;background:#0a1520}
.tab-btn{flex:1;padding:6px 4px;font-size:10px;font-weight:700;color:#7a9ab5;background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-align:center}
.tab-btn.active{color:#fff;border-bottom-color:#c8102e;background:#0f1e2e}
.tab-btn:hover:not(.active){color:#a0c4dd;background:#0d1928}
.tab-pane{display:none;padding:8px 10px;max-height:260px;overflow-y:auto;background:#0a1520}
.tab-pane.active{display:block}
.tab-pane::-webkit-scrollbar{width:3px}
.tab-pane::-webkit-scrollbar-thumb{background:#1e3a52;border-radius:2px}

/* Source label */
.src-label{font-size:9px;color:#7a9ab5;background:#0f1e2e;border:1px solid #1a2e42;border-radius:3px;padding:1px 6px;display:inline-block;margin-bottom:6px}

/* Indicator rows */
.ind-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #0f1e2e}
.ind-row:last-child{border-bottom:none}
.ind-name{font-size:10px;color:#8ab0cc;flex:1}
.ind-val{font-size:11px;font-weight:700;color:#d0dce8;text-align:right}
.ind-unit{font-size:9px;color:#7a9ab5;margin-left:3px}
.ind-nd{font-size:10px;color:#445a6a;font-style:italic}

/* Section titles in tabs */
.sec-title{font-size:10px;font-weight:700;color:#c8102e;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px;padding-bottom:3px;border-bottom:1px solid #1a2e42}
.sec-title:first-child{margin-top:0}

/* No data card */
.nodata-card{background:#0f1e2e;border-radius:5px;padding:10px;text-align:center;color:#445a6a;font-size:11px;border:1px dashed #1a2e42;margin:4px 0}

/* Network button */
.btn-net{width:100%;margin-top:7px;padding:6px;background:linear-gradient(90deg,#c8102e,#9b0d23);color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-net:hover{opacity:.87}

/* Tooltip helper */
.tt-help{font-size:9px;color:#556a7a;margin-left:3px;cursor:help;border-bottom:1px dotted #556a7a}
</style>
</head>

  const color=COL[d.TIPO_BS]||'#aaa';
  const rs=rstr(d.RENIPRESS);
  const idata=IND[rs]||null;
  const sdata=SIS[rs]||null;
  const convs=convByR[rs]||[];
  const nc=convs.length;
  const drawable=convs.filter(c=>(c._side==='BSII'?c.BSI_LAT:c.BSII_LAT)).length;

  const hasA = !!idata;
  const hasB = !!sdata;
  const badgeData = hasA||hasB
    ? `<span class="badge badge-data">● Con datos</span>`
    : `<span class="badge badge-nodata">● Sin datos indicadores</span>`;

  /* --- KPI row (always visible) --- */
  function kpi(val, label, unit, colorCls='', tipColor=null){
    const dispColor = tipColor || color;
    const vHtml = val!=null
      ? `<div class="kpi-v ${colorCls}" style="${!colorCls?'color:'+dispColor:''}">${typeof val==='number'?val.toLocaleString('es-PE'):val}<span class="kpi-u">${unit||''}</span></div>`
      : `<div class="kpi-v sem-gray">—</div>`;
    return `<div class="kpi" style="border-top-color:${dispColor}">${vHtml}<div class="kpi-l">${label}</div></div>`;
  }

  const covGR   = idata?.cobertura_gr;
  const reac    = idata?.tasa_reactividad;
  const donTot  = idata?.don_totales;
  const pctVol  = idata?.pct_voluntaria;
  const sisTrf  = sdata?.transfusion?.precio_neto;
  const sisQty  = sdata?.transfusion?.cantidad;

  const kpiRow = `<div class="kpi-row">
    ${kpi(donTot!=null?fmt(donTot):null,'Donaciones','','')}
    ${kpi(pctVol!=null?pctVol.toFixed(1):null,'% Voluntaria','%', semPct(pctVol,70,40))}
    ${kpi(covGR!=null?covGR.toFixed(1):null,'Cobertura GR','%', semPct(covGR,80,50))}
    ${kpi(reac!=null?reac.toFixed(1):null,'Reactividad','%', semLow(reac,1,3),'#e67e22')}
    ${kpi(sisQty!=null?fmt(sisQty):null,'Consumos SIS','','','#3498db')}
    ${kpi(nc>0?nc:null,'Convenios','','',color)}
  </div>`;

  /* --- TAB A: Operación del banco --- */
  function indRow(name, val, unit, semCls, tip=''){
    const v = val!=null ? `<span class="ind-val ${semCls||''}">${typeof val==='number'?val.toLocaleString('es-PE'):val}</span><span class="ind-unit">${unit||''}</span>`
                        : `<span class="ind-nd">Sin dato</span>`;
    const h = tip ? `<span class="tt-help" title="${tip}">?</span>` : '';
    return `<div class="ind-row"><span class="ind-name">${name}${h}</span>${v}</div>`;
  }

  let tabA = '';
  if(!hasA){
    tabA = `<div class="nodata-card">No se encontraron datos operativos para esta IPRESS<br><small style="color:#334a5a">Fuente: base hemoterápica 2025</small></div>`;
  } else {
    const i=idata;
    tabA = `
    <div class="src-label">Fuente: base hemoterápica · 2025</div>
    <div class="sec-title">Captación de donantes</div>
    ${indRow('Donaciones totales', i.don_totales, 'don.')}
    ${indRow('Donaciones voluntarias', i.don_voluntarias, 'don.')}
    ${indRow('% Voluntaria', i.pct_voluntaria!=null?i.pct_voluntaria.toFixed(1):null, '%', semPct(i.pct_voluntaria,70,40), '% donaciones voluntarias / totales')}
    ${indRow('Donaciones por aféresis', i.don_aferesis, 'don.')}
    ${indRow('Postulantes atendidos', i.postulantes, 'pers.')}
    ${indRow('Diferidos', i.diferidos, 'pers.')}
    ${indRow('Tasa de diferimiento', i.tasa_diferimiento!=null?i.tasa_diferimiento.toFixed(1):null, '%', semLow(i.tasa_diferimiento,10,20), 'diferidos / postulantes')}

    <div class="sec-title">Seguridad transfusional</div>
    ${indRow('Unidades tamizadas', i.tam_total, 'ud.')}
    ${indRow('Unidades reactivas', i.tam_reactivas, 'ud.')}
    ${indRow('Tasa de reactividad', i.tasa_reactividad!=null?i.tasa_reactividad.toFixed(1):null, '%', semLow(i.tasa_reactividad,1,3), 'reactivas / tamizadas')}
    ${indRow('Unidades eliminadas (GR)', i.elim_total, 'ud.')}
    ${indRow('Eliminadas por vencimiento', i.elim_vencimiento, 'ud.')}
    ${indRow('Tasa de vencimiento', i.tasa_vencimiento!=null?i.tasa_vencimiento.toFixed(1):null, '%', semLow(i.tasa_vencimiento,5,15), 'vencidas / eliminadas totales')}
    ${indRow('N° RAT', i.nrat, '', i.nrat>0?'sem-red':'sem-green', 'Reacciones adversas transfusionales')}
    ${indRow('Tasa RAT x1000', i.tasa_rat_1000!=null?i.tasa_rat_1000.toFixed(1):null, '‰', i.tasa_rat_1000>0?'sem-red':'sem-green', 'RAT / GR transfundidas × 1000')}

    <div class="sec-title">Atención transfusional</div>
    ${indRow('GR solicitadas', i.gr_solicitadas, 'ud.')}
    ${indRow('GR atendidas', i.gr_atendidas, 'ud.')}
    ${indRow('Cobertura GR', i.cobertura_gr!=null?i.cobertura_gr.toFixed(1):null, '%', semPct(i.cobertura_gr,80,50), 'GR atendidas / GR solicitadas')}
    ${indRow('Pacientes transfundidos', i.pac_transfundidos, 'pac.')}
    ${indRow('GR transfundidas', i.gr_transfundidos, 'ud.')}
    ${indRow('GR transferidas (externas)', i.gr_transferidas, 'ud.')}
    ${indRow('% Transferencia externa', i.pct_transferencia!=null?i.pct_transferencia.toFixed(1):null, '%', '', 'GR transferidas / GR solicitadas')}
    `;
  }

  /* --- TAB B: Consumo SIS --- */
  let tabB = '';
  if(!hasB){
    tabB = `<div class="nodata-card">No se encontraron registros SIS para esta IPRESS<br><small style="color:#334a5a">Fuente: registros SIS 2025</small></div>`;
  } else {
    const tr = sdata.transfusion;
    const pf = sdata.perfil;
    const cpPac = tr && idata?.pac_transfundidos && idata.pac_transfundidos>0
      ? (tr.precio_neto / idata.pac_transfundidos).toFixed(2) : null;

    tabB = `<div class="src-label">Fuente: registros SIS · 2025</div>`;

    if(tr){
      tabB += `
      <div class="sec-title">Consumo transfusional SIS</div>
      ${indRow('N° consumos transfusionales', tr.cantidad, 'reg.')}
      ${indRow('Costo total transfusional', tr.precio_neto!=null?'S/ '+tr.precio_neto.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}):null, '')}
      ${indRow('Costo promedio por consumo', tr.pu_promedio!=null?'S/ '+tr.pu_promedio.toFixed(2):null, '')}
      ${cpPac!=null ? indRow('Costo prom. por paciente', 'S/ '+parseFloat(cpPac).toLocaleString('es-PE',{minimumFractionDigits:2}), '', '', 'Costo total / pacientes transfundidos (Base A)') : ''}
      `;
    } else {
      tabB += `<div class="nodata-card" style="margin:4px 0">Sin registros de transfusión en SIS</div>`;
    }

    if(pf){
      tabB += `
      <div class="sec-title">Perfiles de donante SIS</div>
      <div class="src-label" style="background:#1a1a2e;border-color:#2a2a4e;color:#6a8aaa">Subbloque: procedimientos SIS relacionados</div>
      ${indRow('N° perfiles procesados', pf.cantidad, 'reg.')}
      ${indRow('Costo total perfiles', pf.precio_neto!=null?'S/ '+pf.precio_neto.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}):null, '')}
      ${indRow('Costo prom. por perfil', pf.pu_promedio!=null?'S/ '+pf.pu_promedio.toFixed(2):null, '', '', 'Costo total perfiles / N° perfiles')}
      `;
    }
  }

  /* --- Convenios section (in tab A) --- */
  let convHtml = '';
  if(nc>0){
    let items='';
    convs.forEach(c=>{
      const isBSII=c._side==='BSII';
      const oName=isBSII?c.BSI:c.BSII;
      const oType=isBSII?('BS '+(c.BSI_TIPO||'I')):'BS II';
      const oReg=isBSII?c.BSI_REGION:c.BSII_REGION;
      const tc=isBSII?(TCOL[(c.BSI_TIPO||'').trim()]||'#9b59b6'):'#c8102e';
      const hasC=isBSII?(c.BSI_LAT&&c.BSI_LON):(c.BSII_LAT&&c.BSII_LON);
      items+=`<div style="padding:3px 6px;margin-bottom:2px;border-radius:3px;border-left:3px solid ${tc};background:#0f1e2e;font-size:10px">
        <div style="font-weight:600;color:#c8dae8">${hasC?'📍':''} ${oName||'—'}</div>
        <div style="color:#6a8aaa"><span style="color:${tc};font-weight:700">${oType}</span> · ${oReg||'—'}</div>
      </div>`;
    });
    convHtml=`
    <div class="sec-title" style="margin-top:10px">Red de convenios (${nc})</div>
    <div style="max-height:120px;overflow-y:auto">${items}</div>
    ${drawable>0?`<button class="btn-net" onclick="showNet('${rs}')">🔗 VER RED EN MAPA (${drawable} enlace${drawable!==1?'s':''})</button>`:''}`;
  }

  return `<div class="pw">
    <div class="ph" style="background:linear-gradient(135deg,${color}22,${color}11);border-bottom:2px solid ${color}">
      <div class="ph-badges">
        <span class="badge badge-tipo" style="background:${color}">${d.TIPO_BS}</span>
        <span class="badge badge-sub">${csub(d.SUBSECTOR)||'—'}</span>
        ${badgeData}
      </div>
      <div class="ph-name">${d.NOMBRE_IPRESS||'Sin nombre'}</div>
      <div class="ph-meta">
        <b>RENIPRESS:</b> ${rs||'—'} &nbsp;·&nbsp;
        <b>DIRESA:</b> ${d.DIRESA||'—'}<br>
        <b>Región:</b> ${d.REGION||'—'} &nbsp;·&nbsp;
        <b>Provincia:</b> ${d.PROVINCIA||'—'} &nbsp;·&nbsp;
        <b>Distrito:</b> ${d.DISTRITO||'—'}
      </div>
    </div>
    ${kpiRow}
    <div class="tabs">
      <button class="tab-btn active" onclick="swTab(this,'ta-${rs}','tb-${rs}')">🏥 Operación banco</button>
      <button class="tab-btn"        onclick="swTab(this,'tb-${rs}','ta-${rs}')">💊 Consumo SIS</button>
    </div>
    <div id="ta-${rs}" class="tab-pane active">${tabA}${convHtml}</div>
    <div id="tb-${rs}" class="tab-pane">${tabB}</div>
  </div>`;
}

function swTab(btn, showId, hideId){
  document.getElementById(showId).classList.add('active');
  document.getElementById(hideId).classList.remove('active');
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* ============ ICONS ============ */
function mkIcon(d, big=false, anim=false){
  const c=COL[d.TIPO_BS]||'#aaa', r=(RAD[d.TIPO_BS]||7)+(big?4:0);
  const an=anim?`animation:${PANIM[d.TIPO_BS]||'pR'} 1.5s infinite`:'';
  const sq=d.TIPO_BS==='BS II';
  return L.divIcon({className:'',
    html:sq?`<div style="width:${r*2}px;height:${r*2}px;background:${c};border:${big?3:2.5}px solid #fff;border-radius:3px;box-shadow:0 0 ${big?14:7}px ${c}99;cursor:pointer;${an}"></div>`
           :`<div style="width:${r*2}px;height:${r*2}px;background:${c};border:${big?3:2}px solid #fff;border-radius:50%;box-shadow:0 0 ${big?14:6}px ${c}88;cursor:pointer;${an}"></div>`,
    iconSize:[r*2,r*2],iconAnchor:[r,r]});
}

BS.forEach(d=>{
  if(!d.LAT||!d.LON) return;
  const m=L.marker([d.LAT,d.LON],{icon:mkIcon(d)});
  m.bindPopup(()=>buildPopup(d),{maxWidth:360,minWidth:340,className:'custom-popup'});
  m._d=d; markers.push(m);
  mByR[rstr(d.RENIPRESS)]=m;
});

/* ============ NETWORK ============ */
function clearNet(){
  netL.forEach(l=>{try{map.removeLayer(l)}catch(e){}});
  netL=[];
  markers.forEach(m=>m.setIcon(mkIcon(m._d)));
  document.getElementById('nbanner').style.display='none';
}
function showNet(rs){
  clearNet();
  const convs=convByR[rs]||[];
  const fm=mByR[rs]; if(!fm) return;
  fm.setIcon(mkIcon(fm._d,true,true));
  const pts=[[fm._d.LAT,fm._d.LON]]; let n=0;
  convs.forEach(c=>{
    const isBSII=c._side==='BSII';
    const oLat=isBSII?c.BSI_LAT:c.BSII_LAT, oLon=isBSII?c.BSI_LON:c.BSII_LON;
    const oR=String(isBSII?c.BSI_RENIPRESS:c.BSII_RENIPRESS||'').replace('.0','');
    const tc=isBSII?(TCOL[(c.BSI_TIPO||'').trim()]||'#9b59b6'):'#c8102e';
    if(!oLat||!oLon) return;
    pts.push([oLat,oLon]); n++;
    const ln=L.polyline([[fm._d.LAT,fm._d.LON],[oLat,oLon]],{color:tc,weight:2.5,opacity:.8,dashArray:'8 5'}).addTo(map);
    netL.push(ln);
    const cm=mByR[oR]; if(cm) cm.setIcon(mkIcon(cm._d,true,false));
  });
  if(pts.length>1){const b=L.latLngBounds(pts);if(b.isValid())map.fitBounds(b,{padding:[60,60],maxZoom:13});}
  const bn=document.getElementById('nbanner');
  const nm=(fm._d.NOMBRE_IPRESS||'').slice(0,38);
  bn.innerHTML=`🔗 <b>${nm}${nm.length>=38?'…':''}</b> — ${n} enlace${n!==1?'s':''} &nbsp;|&nbsp; <u>clic para limpiar</u>`;
  bn.style.display='block';
}
map.on('click',clearNet);

/* ============ FILTERS ============ */
function applyF(){
  const reg=document.getElementById('sr').value.toUpperCase();
  const sub=document.getElementById('ss').value.toUpperCase();
  let v=[];
  markers.forEach(m=>{
    const d=m._d;
    const ok=(!reg||(d.REGION||'').toUpperCase().trim()===reg)
           &&(!sub||csub(d.SUBSECTOR)===sub)
           &&activeT.has(d.TIPO_BS);
    if(ok){if(!map.hasLayer(m))m.addTo(map);v.push(d)}
    else{if(map.hasLayer(m))map.removeLayer(m)}
  });
  document.getElementById('c1a').textContent=v.filter(d=>d.TIPO_BS==='BS I A').length;
  document.getElementById('c1b').textContent=v.filter(d=>d.TIPO_BS==='BS I B').length;
  document.getElementById('c1c').textContent=v.filter(d=>d.TIPO_BS==='BS I C').length;
  document.getElementById('c2').textContent =v.filter(d=>d.TIPO_BS==='BS II').length;
  document.getElementById('vc').textContent =v.length;

  const list=document.getElementById('sbl'); list.innerHTML='';
  v.sort((a,b)=>(a.NOMBRE_IPRESS||'').localeCompare(b.NOMBRE_IPRESS||'')).forEach(d=>{
    const c=COL[d.TIPO_BS], rs=rstr(d.RENIPRESS);
    const nc=(convByR[rs]||[]).length;
    const hasInd=!!IND[rs], hasSis=!!SIS[rs];
    const el=document.createElement('div');
    el.className='sc2'; el.style.borderColor=c;
    el.innerHTML=`<div class="sc2-t" style="color:${c}">${d.TIPO_BS}</div>
      <div class="sc2-n">${d.NOMBRE_IPRESS||'Sin nombre'}</div>
      <div class="sc2-s">${d.REGION||''} · ${csub(d.SUBSECTOR)||'—'}${nc?' · 🔗'+nc:''}${hasInd?' · 📊A':''}${hasSis?' · 💊B':''}</div>`;
    el.onclick=()=>{map.setView([d.LAT,d.LON],14);mByR[rs]?.openPopup()};
    list.appendChild(el);
  });

  if(reg&&v.length){
    const pts=v.filter(d=>d.LAT&&d.LON).map(d=>[d.LAT,d.LON]);
    if(pts.length){const b=L.latLngBounds(pts);if(b.isValid())map.fitBounds(b,{padding:[28,28]})}
  }
}

function tog(btn){
  const t=btn.dataset.t;
  if(activeT.has(t)){if(activeT.size===1)return;activeT.delete(t);btn.classList.replace('on','off')}
  else{activeT.add(t);btn.classList.replace('off','on')}
  applyF();
}

document.getElementById('sr').addEventListener('change',applyF);
document.getElementById('ss').addEventListener('change',applyF);
applyF();
</script>
</body>
</html>
